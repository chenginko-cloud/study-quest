<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2F9E5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="森林闯关台">
<meta name="robots" content="noindex, nofollow">
<title>森林闯关台</title>
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
/* ============================================================
   森林闯关台 · 纯本地单文件版 v1.0
   全部 CSS / JS 内联，零外部依赖，图标与图表均为内联 SVG
   ============================================================ */
:root{
  --bg:#F1FAF0; --card:#FFFFFF; --ink:#1B3D2A; --ink2:#5C7C68; --ink3:#8AA595;
  --green:#2F9E5F; --green-d:#227A48; --green-l:#7BC47F; --green-xl:#E6F5EA;
  --yellow:#F2B33D; --yellow-l:#FDF3DF;
  --orange:#E8833A; --orange-l:#FDEEE2;
  --red:#D9534F; --red-l:#FBE9E8;
  --line:#DCEBE0; --mint:#DFF3E4;
  --r:18px; --r-s:12px;
  --sh:0 2px 10px rgba(31,77,45,.07);
  --sh-b:0 6px 22px rgba(31,77,45,.13);
  --fs:16px;
}
html{font-size:var(--fs);-webkit-text-size-adjust:100%;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  background-image:radial-gradient(circle at 12% 4%,rgba(123,196,127,.16) 0,transparent 42%),
                   radial-gradient(circle at 88% 0%,rgba(242,179,61,.13) 0,transparent 38%);
  background-attachment:fixed;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:1rem;color:inherit;}
svg{display:block;flex:none;}
::-webkit-scrollbar{width:0;height:0;}

#app{max-width:680px;margin:0 auto;min-height:100vh;position:relative;}

/* ---------- 顶栏 ---------- */
#topbar{
  position:sticky;top:0;z-index:60;background:rgba(241,250,240,.93);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  display:flex;align-items:center;gap:10px;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1;}
.brand-name{font-weight:800;font-size:1.06rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.coin-chip{
  display:flex;align-items:center;gap:5px;background:var(--yellow-l);border:1.5px solid rgba(242,179,61,.5);
  border-radius:999px;padding:4px 11px 4px 6px;font-weight:800;color:#8A5D12;font-size:.95rem;white-space:nowrap;
}
.star-chip{display:flex;align-items:center;gap:4px;font-weight:800;color:#8A5D12;background:var(--yellow-l);
  border:1.5px solid rgba(242,179,61,.5);border-radius:999px;padding:4px 10px;font-size:.9rem;white-space:nowrap;}

/* ---------- 主体 ---------- */
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));}
.view{display:none;animation:fadeIn .22s ease;}
.view.on{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 通用卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:12px;}
.card.tight{padding:12px;}
.sec-title{display:flex;align-items:center;gap:7px;font-weight:800;font-size:1rem;margin:18px 2px 10px;}
.sec-title:first-child{margin-top:2px;}
.sec-title .cnt{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--ink3);background:var(--mint);
  border-radius:999px;padding:2px 9px;}
.hint{font-size:.82rem;color:var(--ink2);}
.hint.warn{color:#9A6A18;background:var(--yellow-l);border:1px solid rgba(242,179,61,.4);border-radius:var(--r-s);padding:9px 11px;}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:48px;padding:0 18px;border-radius:14px;font-weight:800;
  background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-d);}
.btn.ghost{background:var(--card);color:var(--green);border:1.6px solid var(--green);box-shadow:0 3px 0 rgba(34,122,72,.16);}
.btn.ghost:active{box-shadow:0 1px 0 rgba(34,122,72,.16);}
.btn.gray{background:var(--mint);color:var(--ink2);box-shadow:0 3px 0 rgba(31,77,45,.08);}
.btn.gray:active{box-shadow:0 1px 0 rgba(31,77,45,.08);}
.btn.danger{background:var(--red-l);color:var(--red);box-shadow:0 3px 0 rgba(217,83,79,.18);}
.btn.sm{min-height:38px;padding:0 13px;font-size:.85rem;border-radius:11px;}
.btn.xs{min-height:34px;padding:0 11px;font-size:.8rem;border-radius:10px;}
.btn:disabled{opacity:.45;box-shadow:none;transform:none;cursor:not-allowed;}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;}
.btn-row .btn{flex:1;min-width:110px;}

/* ---------- 今日任务 ---------- */
.hero{
  background:linear-gradient(135deg,#3FB06C 0%,#2F9E5F 55%,#227A48 100%);
  border-radius:var(--r);padding:16px;color:#fff;box-shadow:var(--sh-b);margin-bottom:12px;position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;
  background:rgba(255,255,255,.09);border-radius:50%;}
.hero-date{font-size:.85rem;opacity:.92;font-weight:600;}
.hero-hi{font-size:1.3rem;font-weight:800;margin:2px 0 10px;}
.hero-bar{height:9px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;}
.hero-bar i{display:block;height:100%;background:var(--yellow);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
.hero-meta{display:flex;gap:14px;margin-top:9px;font-size:.84rem;opacity:.96;flex-wrap:wrap;}
.hero-meta b{font-weight:800;}

.task{
  display:flex;align-items:center;gap:11px;background:var(--card);border:1.6px solid var(--line);
  border-radius:var(--r);padding:12px 13px;margin-bottom:10px;box-shadow:var(--sh);transition:border-color .15s;
}
.task.overdue{border-color:rgba(217,83,79,.45);background:linear-gradient(180deg,#FEF7F6 0,#fff 60%);}
.task.done{opacity:.62;}
.task-ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;}
.task-bd{flex:1;min-width:0;}
.task-t{font-weight:800;font-size:.99rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.task-s{font-size:.8rem;color:var(--ink2);margin-top:2px;}
.tag{font-size:.7rem;font-weight:800;border-radius:7px;padding:2px 7px;letter-spacing:.02em;white-space:nowrap;}
.tag.red{background:var(--red-l);color:var(--red);}
.tag.orange{background:var(--orange-l);color:#B85C1E;}
.tag.green{background:var(--green-xl);color:var(--green-d);}
.tag.gray{background:var(--mint);color:var(--ink2);}
.tag.yellow{background:var(--yellow-l);color:#8A5D12;}

/* ---------- 闯关地图 ---------- */
.island{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh);}
.island-hd{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.island-nm{font-weight:800;font-size:1.02rem;}
.island-sub{font-size:.78rem;color:var(--ink3);}
.path{position:relative;padding-left:4px;}
.node{
  display:flex;align-items:center;gap:11px;padding:10px;margin-bottom:8px;border-radius:14px;
  border:1.6px solid var(--line);background:var(--card);position:relative;transition:transform .1s;
}
.node::before{content:"";position:absolute;left:30px;top:-8px;width:2px;height:8px;background:var(--line);}
.node:first-child::before{display:none;}
.node.locked{opacity:.55;background:#F7FAF8;}
.node.open{border-color:var(--green);background:var(--green-xl);box-shadow:0 2px 0 rgba(47,158,95,.2);}
.node:not(.locked):active{transform:scale(.985);}
.node-ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  border:2.5px solid var(--line);background:#fff;}
.node.open .node-ic{border-color:var(--green);}
.node.done .node-ic{border-color:var(--yellow);background:var(--yellow-l);}
.node-bd{flex:1;min-width:0;}
.node-nm{font-weight:800;font-size:.97rem;}
.node-meta{font-size:.78rem;color:var(--ink2);display:flex;align-items:center;gap:7px;margin-top:1px;flex-wrap:wrap;}
.stars{display:flex;gap:2px;}

/* ---------- 错题 ---------- */
.mistake{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--sh);}
.mistake-q{font-weight:700;font-size:.95rem;margin-bottom:8px;}
.opt-line{display:flex;align-items:flex-start;gap:8px;font-size:.87rem;padding:4px 0;border-radius:8px;}
.opt-line.right{color:var(--green-d);font-weight:800;}
.opt-line.wrong{color:var(--orange);font-weight:700;}
.opt-k{flex:none;width:20px;height:20px;border-radius:6px;background:var(--mint);color:var(--ink2);
  font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.opt-line.right .opt-k{background:var(--green-xl);color:var(--green-d);}
.opt-line.wrong .opt-k{background:var(--orange-l);color:#B85C1E;}
.reason-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
.chip{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:.8rem;font-weight:700;color:var(--ink2);min-height:34px;}
.chip.on{background:var(--orange-l);border-color:var(--orange);color:#B85C1E;}

/* ---------- 商城 ---------- */
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.shop-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:7px;}
.shop-nm{font-weight:800;font-size:.95rem;line-height:1.35;}
.shop-pr{display:flex;align-items:center;gap:4px;font-weight:800;color:#8A5D12;}
.shop-out{opacity:.5;}
.order{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-s);padding:10px 12px;margin-bottom:8px;}
.order-bd{flex:1;min-width:0;}
.order-t{font-weight:700;font-size:.92rem;}
.order-s{font-size:.78rem;color:var(--ink2);margin-top:1px;}

/* ---------- 表单 ---------- */
.field{margin-bottom:13px;}
.lb{display:block;font-size:.85rem;font-weight:800;color:var(--ink2);margin-bottom:5px;}
.lb .req{color:var(--red);}
.inp{width:100%;min-height:48px;border:1.6px solid var(--line);border-radius:12px;padding:11px 13px;
  background:#fff;font-size:1rem;transition:border-color .15s;}
.inp:focus{outline:none;border-color:var(--green);}
textarea.inp{min-height:88px;resize:vertical;line-height:1.55;}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235C7C68' stroke-width='3' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:38px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.sw:last-child{border-bottom:none;}
.sw-nm{font-weight:700;font-size:.93rem;}
.sw-ds{font-size:.76rem;color:var(--ink3);}
.tg{width:50px;height:29px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none;}
.tg i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .2s;}
.tg.on{background:var(--green);}
.tg.on i{transform:translateX(21px);}

/* ---------- 统计卡 ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--sh);}
.stat-n{font-size:1.5rem;font-weight:800;line-height:1.2;}
.stat-l{font-size:.79rem;color:var(--ink2);margin-top:1px;}
.stat.full{grid-column:1/-1;}

/* ---------- 底部导航 ---------- */
#tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:70;max-width:680px;margin:0 auto;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;
  color:var(--ink3);font-size:.7rem;font-weight:700;min-height:50px;justify-content:center;border-radius:12px;}
.tab.on{color:var(--green);background:var(--green-xl);}
.tab .dot{position:absolute;margin:-4px 0 0 20px;width:8px;height:8px;border-radius:50%;background:var(--red);}

/* ---------- 遮罩层 ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;
  max-width:680px;margin:0 auto;}
.overlay.on{display:flex;}
.ov-head{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;}
.ov-title{font-weight:800;font-size:1.02rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(24px + env(safe-area-inset-bottom));}
.iconbtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--mint);color:var(--ink2);flex:none;}
.iconbtn:active{background:var(--line);}

/* ---------- 答题 ---------- */
#quizLayer{background:linear-gradient(170deg,#F1FAF0 0%,#E6F5EA 100%);}
.quiz-top{padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;display:flex;align-items:center;gap:11px;}
.quiz-bar{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden;}
.quiz-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-l),var(--green));
  border-radius:999px;transition:width .35s cubic-bezier(.2,.8,.2,1);}
.quiz-body{flex:1;overflow-y:auto;padding:6px 16px 16px;}
.q-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px;}
.q-stem{font-size:1.12rem;font-weight:700;line-height:1.62;margin-bottom:16px;word-break:break-word;}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  border:1.8px solid var(--line);background:#fff;border-radius:15px;padding:13px 14px;margin-bottom:10px;
  min-height:56px;transition:border-color .15s,background .15s,transform .08s;
}
.opt:active{transform:scale(.99);}
.opt .k{flex:none;width:29px;height:29px;border-radius:9px;background:var(--mint);color:var(--ink2);
  font-weight:800;font-size:.86rem;display:flex;align-items:center;justify-content:center;}
.opt .tx{flex:1;font-size:1rem;line-height:1.5;word-break:break-word;padding-top:2px;}
.opt.sel{border-color:var(--green);background:var(--green-xl);}
.opt.sel .k{background:var(--green);color:#fff;}
.opt.ok{border-color:var(--green);background:var(--green-xl);}
.opt.ok .k{background:var(--green);color:#fff;}
.opt.no{border-color:var(--orange);background:var(--orange-l);}
.opt.no .k{background:var(--orange);color:#fff;}
.opt.dis{pointer-events:none;}
.fb{border-radius:15px;padding:13px 15px;margin-top:4px;animation:popIn .26s cubic-bezier(.2,1.2,.3,1);}
.fb.good{background:var(--green-xl);border:1.6px solid var(--green-l);}
.fb.bad{background:var(--orange-l);border:1.6px solid rgba(232,131,58,.45);}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
.fb-hd{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:6px;}
.fb.good .fb-hd{color:var(--green-d);}
.fb.bad .fb-hd{color:#B85C1E;}
.fb-tx{font-size:.92rem;line-height:1.62;color:var(--ink);word-break:break-word;}
.fb-tx b{color:var(--green-d);}
.quiz-foot{padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);}

/* ---------- 结果 ---------- */
.result{text-align:center;padding:18px 8px 6px;}
.result-ic{margin:0 auto 12px;width:96px;height:96px;}
.result-h{font-size:1.5rem;font-weight:800;margin-bottom:5px;}
.result-p{font-size:.95rem;color:var(--ink2);margin-bottom:14px;}
.result-stars{display:flex;justify-content:center;gap:8px;margin-bottom:14px;}
.result-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:12px;text-align:left;}
.res-line{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:.9rem;
  border-bottom:1px dashed var(--line);}
.res-line:last-child{border-bottom:none;}
.res-line .v{font-weight:800;}

/* ---------- 家长中心 ---------- */
#parentLayer{background:#EDF6F4;}
.pt-tabs{display:flex;overflow-x:auto;gap:7px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line);flex:none;}
.pt-tab{padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:800;color:var(--ink2);
  background:var(--mint);white-space:nowrap;min-height:38px;display:flex;align-items:center;}
.pt-tab.on{background:var(--green);color:#fff;}
.pt-badge{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);
  color:#fff;font-size:.68rem;line-height:18px;text-align:center;margin-left:5px;}
table.rep{width:100%;border-collapse:collapse;font-size:.85rem;}
table.rep th,table.rep td{padding:8px 7px;text-align:left;border-bottom:1px solid var(--line);}
table.rep th{color:var(--ink2);font-weight:800;font-size:.78rem;}
table.rep td.n{font-weight:800;}
.scatter{overflow-x:auto;-webkit-overflow-scrolling:touch;}

/* ---------- Toast / 弹窗 ---------- */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:88vw;}
.toast{background:rgba(27,61,42,.95);color:#fff;padding:11px 18px;border-radius:14px;font-size:.9rem;font-weight:700;
  box-shadow:var(--sh-b);animation:tIn .26s cubic-bezier(.2,1.2,.3,1);text-align:center;}
.toast.ok{background:var(--green-d);}
.toast.err{background:var(--red);}
.toast.warn{background:#A9701B;}
@keyframes tIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}

#modal{position:fixed;inset:0;z-index:400;background:rgba(20,40,28,.44);display:none;
  align-items:center;justify-content:center;padding:18px;}
#modal.on{display:flex;}
.modal-box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:400px;max-height:86vh;overflow-y:auto;
  box-shadow:var(--sh-b);animation:mIn .24s cubic-bezier(.2,1.1,.3,1);}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
.modal-t{font-weight:800;font-size:1.08rem;margin-bottom:8px;}
.modal-c{font-size:.94rem;color:var(--ink2);margin-bottom:16px;line-height:1.6;}

/* ---------- 撒花 ---------- */
#confetti{position:fixed;inset:0;z-index:500;pointer-events:none;display:none;}
#confetti.on{display:block;}
.cf{position:absolute;top:-14px;width:9px;height:14px;opacity:.95;animation:cfFall linear forwards;}
@keyframes cfFall{

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function uid(p){ return (p||"id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ var d=new Date(); return ymd(d); }
function ymd(d){
  var m=d.getMonth()+1, dd=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;
}
function addDays(ds, n){ var p=ds.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return ymd(d); }
function dayDiff(a,b){ var pa=a.split("-"),pb=b.split("-");
  var da=Date.UTC(+pa[0],+pa[1]-1,+pa[2]), db=Date.UTC(+pb[0],+pb[1]-1,+pb[2]);
  return Math.round((db-da)/86400000); }
function cnDate(ds){ var p=ds.split("-"); return (+p[1])+"月"+(+p[2])+"日"; }
function weekdayCn(ds){ var p=ds.split("-"); var w=new Date(+p[0],+p[1]-1,+p[2]).getDay();
  return ["周日","周一","周二","周三","周四","周五","周六"][w]; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function sum(arr,f){ var t=0; for(var i=0;i<arr.length;i++) t+=(f?f(arr[i]):arr[i]); return t; }

/* 确定性伪随机：同一 seed 永远同一序列，保证每日计划可复现 */
function seedRand(seed){
  var h = 2166136261;
  for(var i=0;i<seed.length;i++){ h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(){
    h += 0x6D2B79F5; var t = h;
    t = Math.imul(t ^ (t>>>15), t|1);
    t ^= t + Math.imul(t ^ (t>>>7), t|61);
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  };
}
function shuffleSeed(arr, seed){
  var r = seedRand(seed), a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function toast(msg, kind, ms){
  var el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  $("toast").appendChild(el);
  setTimeout(function(){ if(el.parentNode){ el.style.opacity="0"; el.style.transition="opacity .3s";
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); } }, ms||2200);
}

function defaultState(){
  return {
    schemaVersion: SCHEMA,
    createdAt: Date.now(),
    version: "v1.0",
    family: { name:"我的家", timezone:"Asia/Shanghai" },
    parent: { hasPin:false, pinHash:null, pinSalt:null, setupAt:0 },
    child:  { nickname:"小探险家", grade:"三年级", avatar:"leaf", goal:"每天完成 3 个任务" },
    subjects: [],
    levels: [],
    questions: [],
    mastery: {},
    mistakes: [],
    plans: {},
    attempts: [],
    ledger: [],
    items: [],
    orders: [],
    checkins: [],
    audit: [],
    settings: defaultSettings(),
    seeded: false
  };
}

function load(){
  var raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch(e){ raw = null; }
  if(!raw){ state = defaultState(); plantSeed(); save(); return; }
  try {
    var obj = JSON.parse(raw);
    state = migrate(obj);
  } catch(e){
    state = defaultState(); plantSeed(); save();
    toast("本地数据读取失败，已重建（旧数据保留在备份中）","err",4000);
  }
}

/* 结构迁移：只补不删，保证老数据向后兼容 */
function migrate(o){
  var d = defaultState();
  for(var k in d){ if(!(k in o)) o[k] = d[k]; }
  for(var s in d.settings){ if(!(s in o.settings)) o.settings[s] = d.settings[s]; }
  for(var p in d.parent){ if(!(p in o.parent)) o.parent[p] = d.parent[p]; }
  for(var c in d.child){ if(!(c in o.child)) o.child[c] = d.child[c]; }
  o.schemaVersion = SCHEMA;
  return o;
}

function save(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    return true;
  } catch(e){
    toast("保存失败：本地存储空间不足，请先导出备份","err",5000);
    return false;
  }
}

function audit(action, target, reason){
  state.audit.unshift({ ts: Date.now(), actor: "家长", action: action, target: target, reason: reason||"" });
  if(state.audit.length > 400) state.audit.length = 400;
}

/* 账本：唯一写入口。幂等键相同则拒绝重复写入 */
function addLedger(type, amount, source, sourceId, idemKey, reason, actor){
  if(idemKey){
    for(var i=0;i<state.ledger.length;i++){
      if(state.ledger[i].idemKey === idemKey) return false;
    }
  }
  state.ledger.push({
    id: uid("led"), ts: Date.now(), type: type, amount: amount,
    source: source, sourceId: sourceId||"", idemKey: idemKey||"",
    reason: reason||"", actor: actor||"系统", effective: true
  });
  return true;
}
function getBalance(){
  var t = 0;
  for(var i=0;i<state.ledger.length;i++){ if(state.ledger[i].effective) t += state.ledger[i].amount; }
  return t;
}
function todayEarned(){
  var d = todayStr(), t = 0;
  for(var i=0;i<state.ledger.length;i++){
    var L = state.ledger[i];
    if(L.effective && L.amount > 0 && ymd(new Date(L.ts)) === d) t += L.amount;
  }
  return t;
}
/* 今日剩余可发额度，达到上限后不再发币（但不阻断学习） */
function coinCapLeft(){
  var cap = state.settings.coinDailyCap;
  if(cap <= 0) return 9999;
  return Math.max(0, cap - todayEarned());
}
function grantCoin(amount, source, sourceId, idemKey, reason){
  if(amount <= 0) return 0;
  var left = coinCapLeft();
  if(left <= 0) return 0;
  var real = Math.min(amount, left);
  var ok = addLedger("earn", real, source, sourceId, idemKey, reason, "系统");
  if(ok && real < amount){ /* 到上限部分静默丢弃，不打扰孩子 */ }
  return ok ? real : 0;
}

function clearDemo(){
  state.attempts = state.attempts.filter(function(a){ return !a.demo; });

  state.checkins = state.checkins.filter(function(c){ return !c.demo; });
  state.mistakes = state.mistakes.filter(function(m){ return !m.demo; });
  Object.keys(state.plans).forEach(function(k){ if(state.plans[k] && state.plans[k].demo) delete state.plans[k]; });
  /* 关卡进度按剩余的真实作答重算，不删除任何真实学习记录 */
  state.levels.forEach(function(L){
    var real = state.attempts.filter(function(a){ return a.lv === L.id; });
    L.star = real.length ? Math.max.apply(null, real.map(function(a){ return a.star||0; })) : 0;
    L.status = L.star > 0 ? "done" : "open";
    L.unlocked = true;
  });
  state.plans[todayStr()] = null; delete state.plans[todayStr()];
  save();
}

/* ---------- 掌握度：可解释加权模型 ----------
   mastery = 0.45×近期正确率 + 0.20×间隔复现 + 0.15×难度表现
           + 0.10×独立完成度 + 0.10×稳定性
   样本不足 3 次时不允许显示虚假百分比                                  */
function kpRecords(kp){
  var out = [];
  state.attempts.forEach(function(a){
    if(a.demo) return;
    (a.responses||[]).forEach(function(r){
      var q = questionById(r.q);
      if(!q || q.kp !== kp) return;
      out.push({ ok:!!r.ok, hint:r.hint||0, t:a.endedAt||a.startedAt||Date.now(), dif:q.dif||3 });
    });
  });
  return out.sort(function(a,b){ return a.t-b.t; });
}
function computeMastery(kp){
  var rec = kpRecords(kp);
  if(rec.length < 3) return { insufficient:true, n:rec.length, score:null };
  var recent = rec.slice(-5);
  var w=0, ws=0;
  for(var i=0;i<recent.length;i++){
    var wt = Math.pow(0.85, recent.length-1-i);
    w += wt * (recent[i].ok?1:0); ws += wt;
  }
  var acc = ws ? w/ws : 0;
  var days = {}; rec.forEach(function(r){ days[ymd(new Date(r.t))] = 1; });
  var rep = clamp(Object.keys(days).length/3, 0, 1);
  var okRec = rec.filter(function(r){ return r.ok; });
  var difAvg = okRec.length ? sum(okRec,function(r){return r.dif;})/okRec.length : 0;
  var difScore = clamp(difAvg/5, 0, 1);
  var avgHint = sum(rec,function(r){return r.hint;})/rec.length;
  var indep = clamp(1 - avgHint/2, 0, 1);
  var vals = recent.map(function(r){ return r.ok?1:0; });
  var mean = sum(vals)/vals.length;
  var vr = sum(vals,function(v){ return Math.pow(v-mean,2); })/vals.length;
  var stab = clamp(1 - Math.sqrt(vr)/0.5, 0, 1);
  var score = 0.45*acc + 0.20*rep + 0.15*difScore + 0.10*indep + 0.10*stab;
  return { insufficient:false, n:rec.length, score:score,
           parts:{ acc:acc, rep:rep, dif:difScore, indep:indep, stab:stab,
                   W:{acc:0.45,rep:0.20,dif:0.15,indep:0.10,stab:0.10} } };
}
function masteryText(kp){
  var m = computeMastery(kp);
  if(m.insufficient) return "样本不足（"+m.n+"/3）";
  return Math.round(m.score*100) + "%";
}
function weakPoints(){
  var out = [];
  kpList().forEach(function(kp){
    var m = computeMastery(kp);
    if(m.insufficient) return;
    out.push({ kp:kp, score:m.score, nm:kpName(kp) });
  });
  return out.sort(function(a,b){ return a.score-b.score; });
}

/* ---------- 错题闭环：新错题 → 待复习 → 复习中 → 已掌握 → 可归档 ---------- */
function getDueReviews(){
  var d = todayStr();
  return state.mistakes.filter(function(m){
    return m.state !== "mastered" && m.state !== "archived" && m.next && m.next <= d;
  });
}
function upsertMistake(qid, ok, reason){
  var q = questionById(qid); if(!q) return null;
  var d = todayStr(), IV = state.settings.reviewIntervals;
  var m = null;
  for(var i=0;i<state.mistakes.length;i++) if(state.mistakes[i].q===qid) { m = state.mistakes[i]; break; }
  if(!m){
    if(ok) return null;                       // 第一次就答对，不进错题本
    m = { id:uid("m"), q:qid, kp:q.kp, sj:q.sj, state:"todo", stage:0, wrong:1, right:0,
          reason:reason||"", created:d, next:addDays(d, IV[0]), history:[{t:Date.now(), ev:"wrong"}] };
    state.mistakes.push(m); return m;
  }
  if(ok){
    m.right++;
    if(m.state === "mastered"){ m.history.push({t:Date.now(), ev:"right"}); return m; }
    m.stage = Math.min(m.stage+1, IV.length-1);
    if(m.stage >= 2 && m.right >= 2){ m.state = "mastered"; m.next = null; }
    else { m.state = "learning"; m.next = addDays(d, IV[m.stage]); }
  } else {
    m.wrong++; m.right = 0; m.stage = 0; m.state = "todo";
    m.next = addDays(d, IV[0]);
    if(reason) m.reason = reason;
  }
  m.history.push({ t:Date.now(), ev: ok?"right":"wrong" });
  return m;
}

/* ---------- 每日计划：确定性生成，刷新不变，结果存快照 ---------- */
function ensurePlan(){
  var d = todayStr(), St = state.settings;
  if(state.plans[d] && state.plans[d].tasks) return state.plans[d];

  var tasks = [], estTotal = 0;

  /* 1) 逾期任务顺延（最多 maxOverdueRoll 条，避免滚雪球） */
  var pastKeys = Object.keys(state.plans).filter(function(k){ return k < d; }).sort();
  var carried = [];
  pastKeys.forEach(function(k){
    var p = state.plans[k];
    if(!p || !p.tasks) return;
    p.tasks.forEach(function(t){ if(!t.done) carried.push({ t:t, from:k }); });
  });
  var nRoll = Math.min(carried.length, St.maxOverdueRoll);
  for(var i=0;i<nRoll;i++){
    var src = carried[i].t;
    tasks.push({ id:uid("task"), type:src.type, lv:src.lv, sj:src.sj, nm:src.nm, est:src.est,
                 done:false, carried:true, from:carried[i].from, fromId:src.id });
    estTotal += src.est||5;
  }

  /* 2) 已到复习日期的错题，优先级仅次于逾期 */
  var due = getDueReviews();
  if(due.length){
    var n = Math.min(due.length, 6);
    tasks.push({ id:uid("task"), type:"review", sj:"mixed", nm:"错题复习 "+n+" 题",
                 est: Math.max(3, Math.round(n*1.2)), done:false, qids: due.slice(0,n).map(function(m){ return m.q; }) });
    estTotal += Math.max(3, Math.round(n*1.2));
  }

  /* 3) 学科轮转：每科取第一个未通关的关卡，起点按日期轮换保证均衡 */
  var sjIds = state.subjects.filter(function(s){ return s.enabled !== false; }).map(function(s){ return s.id; });
  if(sjIds.length){
    var rot = (new Date(d.replace(/-/g,"/")).getDate()) % sjIds.length;
    var ordered = sjIds.slice(rot).concat(sjIds.slice(0,rot));
    for(var s=0; s<ordered.length && tasks.length < St.dailyTaskCount; s++){
      var sid = ordered[s];
      var lv = levelsOf(sid).filter(function(L){ return L.status !== "done"; })[0];
      if(!lv) continue;
      var qs = levelQuestions(lv.id);
      if(!qs.length) continue;
      var est = Math.max(3, Math.round(sum(qs,function(q){return q.est||40;})/60));
      if(estTotal + est > St.dailyBudgetMin + 5) continue;      // 受每日时间预算约束
      if(!tasks.some(function(t){ return t.lv === lv.id; })){
        tasks.push({ id:uid("task"), type:"level", lv:lv.id, sj:sid,
                     nm:subjectById(sid).nm + " · " + lv.nm, est:est, done:false });
        estTotal += est;
      }
    }
  }

  /* 4) 任务不足时，用薄弱知识点的自由练习补齐 */
  if(tasks.length < St.dailyTaskCount){
    var weak = weakPoints().slice(0,3);
    for(var wi=0; wi<weak.length && tasks.length < St.dailyTaskCount; wi++){
      var pool = state.questions.filter(function(q){ return q.status==="published" && q.kp===weak[wi].kp; });
      if(!pool.length) continue;
      tasks.push({ id:uid("task"), type:"weak", sj:pool[0].sj, nm:"薄弱突破 · " + weak[wi].nm,
                   est:4, done:false, qids: shuffleSeed(pool.map(function(q){return q.id;}), "weak_"+d+weak[wi].kp).slice(0,4) });
      estTotal += 4;
    }
  }

  tasks = tasks.slice(0, St.dailyTaskCount);
  var plan = { tasks: tasks, generatedAt: Date.now(), estTotal: estTotal };
  state.plans[d] = plan;
  save();
  return plan;
}
function planOf(d){ return state.plans[d]; }
function todayTasks(){ var p = ensurePlan(); return p ? p.tasks : []; }
function todayPlan(){
  var p = ensurePlan(), d = todayStr();
  return { date:d, tasks:p ? p.tasks : [], est:p ? p.estTotal : 0 };
}
function overdueCount(fn){
  var n = 0;
  (fn||todayTasks()).forEach(function(t){ if(t.carried && !t.done) n++; });
  return n;
}

/* ---------- 答题引擎 ---------- */
function startQuiz(task, planDate){
  var d = planDate || todayStr();
  var qids = [];
  if(task.type === "level"){
    var qs = levelQuestions(task.lv);
    var n = state.settings.levelQuestionCount;
    qids = shuffleSeed(qs.map(function(q){return q.id;}), "lv_"+task.lv).slice(0, n);
    if(qids.length < Math.min(n, qs.length)) qids = qs.slice(0,n).map(function(q){return q.id;});
  } else {
    qids = (task.qids||[]).slice(0, 8);
  }
  if(!qids.length){ toast("这道题暂时没有可练习的题目","warn"); return false; }
  quiz = {
    task: task, planDate: d, lv: task.lv || null,
    qids: qids, idx: 0, startedAt: Date.now(), qStart: Date.now(),
    answers: [], tries: 0, shownHint: 0, revealed: false, finished: false, phase: "ask"
  };
  $("quizBack").innerHTML = ic("back",20,"#1B3D2A",2.2);
  $("quizLayer").classList.add("on");
  document.body.style.overflow = "hidden";
  return true;
}
function closeQuiz(){
  $("quizLayer").classList.remove("on");
  document.body.style.overflow = "";
  quiz = null;
}
function currentQ(){ return quiz ? questionById(quiz.qids[quiz.idx]) : null; }

/* 提交答案：错第一次给提示1，错第二次给提示2+解析，第三次直接公布答案 */
function submitAnswer(pick){
  if(!quiz || quiz.phase === "done") return;
  var q = currentQ(); if(!q) return;
  var ok = (pick === q.a);
  if(quiz.phase === "ask"){
    quiz.tries++;
    quiz.lastPick = pick;
    if(ok){
      quiz.answers.push({ q:q.id, pick:pick, ok:true, hint:quiz.shownHint, ms:Date.now()-quiz.qStart, tries:quiz.tries });
      quiz.phase = "fb"; quiz.resultOk = true;
      upsertMistake(q.id, true, "");
    } else {
      if(quiz.tries === 1){
        quiz.shownHint = Math.max(quiz.shownHint, 1);
        quiz.phase = "fb"; quiz.resultOk = false; quiz.hintText = q.hints[0];
      } else if(quiz.tries === 2){
        quiz.shownHint = 2;
        quiz.phase = "fb"; quiz.resultOk = false; quiz.hintText = q.hints[1] || q.hints[0]; quiz.showAnalysis = true;
      } else {
        quiz.shownHint = 2; quiz.revealed = true;
        quiz.answers.push({ q:q.id, pick:pick, ok:false, hint:2, ms:Date.now()-quiz.qStart, tries:quiz.tries });
        quiz.phase = "fb"; quiz.resultOk = false; quiz.showAnalysis = true; quiz.gaveUp = true;
        upsertMistake(q.id, false, "不会做");
      }
    }
    renderQuiz(); save(); return;
  }
  /* 反馈后：点了「再试一次」或「下一题」 */
  if(quiz.phase === "fb"){
    if(!quiz.resultOk && !quiz.revealed && !quiz.gaveUp){ quiz.phase = "ask"; renderQuiz(); return; }
    nextQuestion();
  }
}
function nextQuestion(){
  if(quiz.idx >= quiz.qids.length - 1){
    if(quiz.resultOk || quiz.revealed || quiz.gaveUp){
      if(!quiz.answers.some(function(a){ return a.q === quiz.qids[quiz.idx]; })){
        quiz.answers.push({ q:quiz.qids[quiz.idx], pick:quiz.lastPick, ok:!!quiz.resultOk,
                            hint:quiz.shownHint, ms:Date.now()-quiz.qStart, tries:quiz.tries });
      }
    }
    finishQuiz();
  } else {
    quiz.idx++; quiz.tries = 0; quiz.shownHint = 0; quiz.revealed = false;
    quiz.gaveUp = false; quiz.showAnalysis = false; quiz.resultOk = false;
    quiz.qStart = Date.now(); quiz.phase = "ask";
    renderQuiz();
  }
}
function finishQuiz(){
  quiz.finished = true; quiz.phase = "done";
  var total = quiz.qids.length;
  var correct = quiz.answers.filter(function(a){ return a.ok; }).length;
  var acc = total ? correct/total : 0;
  var hints = sum(quiz.answers, function(a){ return a.hint; });
  var dur = Math.round((Date.now() - quiz.startedAt)/1000);

  var att = { id:uid("att"), lv:quiz.lv, type:quiz.task.type, date:quiz.planDate,
              startedAt:quiz.startedAt, endedAt:Date.now(), duration:dur,
              total:total, correct:correct, acc:acc, hints:hints,
              responses: quiz.answers.slice(), planTaskId:quiz.task.id };
  state.attempts.push(att);

  /* 星标：全对3星，错1题2星，达标1星，否则0星但不羞辱 */
  var star = 0, passed = false;
  if(quiz.task.type === "level" && quiz.lv){
    if(correct === total) star = 3;
    else if(correct >= total-1) star = 2;
    else if(acc >= state.settings.passScore) star = 1;
    passed = acc >= state.settings.passScore;
    var L = levelById(quiz.lv);
    if(L){
      L.star = Math.max(L.star||0, star);
      if(passed){
        L.status = "done";
        /* 解锁下一关：严格顺序，且只解锁一次 */
        var nx = levelsOf(L.sj).filter(function(x){ return x.order === L.order+1; })[0];
        if(nx && !nx.unlocked){ nx.unlocked = true; nx.status = "open"; }
      } else {
        L.status = L.star>0 ? "retry" : "open";
      }
    }
  } else {
    star = correct === total ? 3 : (acc>=0.6 ? 2 : (correct>0 ? 1 : 0));
    passed = acc >= 0.6;
  }

  /* 记账：每一笔都带幂等键，重复点击/刷新/回退都不会重复发币 */
  var earned = 0, d = quiz.planDate;
  quiz.answers.forEach(function(a){
    if(a.ok) earned += grantCoin(state.settings.coinPerQuestion, "question", a.q, "q:"+d+":"+a.q, "答对奖励");
  });
  if(quiz.task.type === "level" && passed && quiz.lv){
    earned += grantCoin(state.settings.coinPerLevel, "level", quiz.lv, "lv:"+quiz.lv, "首次通关奖励");
    if(star === 3) earned += grantCoin(state.settings.coinPerStar*3, "star", quiz.lv, "star:"+quiz.lv, "三星全对额外奖励");
  }
  /* 打卡：任何类型的任务完成都算一次 */
  var ck = checkinToday(Math.ceil(dur/60));

  /* 标记任务完成（含顺延来源的原始任务） */
  var plan = state.plans[quiz.planDate];
  if(plan){
    for(var i=0;i<plan.tasks.length;i++){
      if(plan.tasks[i].id === quiz.task.id){ plan.tasks[i].done = true; plan.tasks[i].doneAt = Date.now(); }
    }
  }
  if(quiz.task.carried && quiz.task.from && quiz.task.fromId){
    var src = state.plans[quiz.task.from];
    if(src) for(var j=0;j<src.tasks.length;j++){
      if(src.tasks[j].id === quiz.task.fromId){ src.tasks[j].done = true; src.tasks[j].doneAt = Date.now(); src.tasks[j].rolledDone = true; }
    }
  }
  save();
  renderResult(att, star, passed, earned, ck);
}

/* ---------- 金币商城闭环 ---------- */
function weekKey(){
  var d = new Date(); var onejan = new Date(d.getFullYear(),0,1);
  return d.getFullYear() + "-W" + Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
}
function weeklyBought(itemId){
  var wk = weekKey();
  return state.orders.filter(function(o){
    return o.itemId===itemId && o.wk===wk && o.status!=="rejected" && o.status!=="cancelled";
  }).length;
}
function canRedeem(item){
  if(!item || item.status !== "on") return { ok:false, msg:"这件奖励已下架" };
  if(item.stock <= 0) return { ok:false, msg:"库存不足，请让家长补充" };
  if(item.limitW > 0 && weeklyBought(item.id) >= item.limitW) return { ok:false, msg:"本周兑换已达上限（限 "+item.limitW+" 次）" };
  if(getBalance() < item.price) return { ok:false, msg:"金币还不够，再努力一下" };
  return { ok:true };
}
function createOrder(itemId){
  var it = itemById(itemId);
  var ck = canRedeem(it);
  if(!ck.ok){ toast(ck.msg,"warn"); return false; }
  var balanceBefore = getBalance();
  var order = {
    id: uid("ord"), itemId: it.id, wk: weekKey(), status: "pending",
    snap: { nm:it.nm, cat:it.cat, price:it.price, desc:it.desc||"" },   // 价格快照，后续改价不影响
    createdAt: Date.now(), createdBy: "孩子", balanceBefore: balanceBefore
  };
  /* 冻结金币 + 扣库存，顺序写并在任一步失败时整体回滚 */
  it.stock -= 1;
  var ok = addLedger("spend", -it.price, "redeem", order.id, "spend:"+order.id, "兑换：" + it.nm, "孩子");
  if(!ok || getBalance() < 0){
    it.stock += 1;
    toast("兑换失败，请重试","err"); return false;
  }
  state.orders.unshift(order);
  save();
  return true;
}
function cancelOrder(oid){
  var o = state.orders.filter(function(x){ return x.id===oid; })[0];
  if(!o || o.status !== "pending") { toast("只有待审核的兑换可以取消","warn"); return false; }
  refundInternal(o, "孩子取消", "cancelled");
  toast("已取消，金币已退回","ok"); return true;
}
function rejectOrder(oid, reason){
  var o = state.orders.filter(function(x){ return x.id===oid; })[0];
  if(!o || o.status !== "pending"){ toast("该订单已处理过","warn"); return false; }
  refundInternal(o, reason||"家长拒绝", "rejected");
  return true;
}
function approveOrder(oid, note){
  var o = state.orders.filter(function(x){ return x.id===oid; })[0];
  if(!o || o.status !== "pending"){ toast("该订单已处理过","warn"); return false; }
  o.status = "approved"; o.decidedAt = Date.now(); o.decidedBy = "家长"; o.note = note||"";
  audit("批准兑换", o.snap.nm, note||""); save(); return true;
}
function useOrder(oid){
  var o = state.orders.filter(function(x){ return x.id===oid; })[0];
  if(!o || o.status !== "approved"){ toast("只有已批准的兑换可以核销","warn"); return false; }
  o.status = "used"; o.usedAt = Date.now(); o.usedBy = "家长";
  audit("核销奖励", o.snap.nm, ""); save(); return true;
}
/* 退款：同一订单只允许退一次，靠幂等键保证 */
function refundInternal(o, reason, newStatus){
  o.status = newStatus; o.decidedAt = Date.now(); o.decidedBy = reason || "系统";
  addLedger("refund", o.snap.price, "refund", o.id, "refund:"+o.id, "退回：" + o.snap.nm, "系统");
  var it = itemById(o.itemId);
  if(it) it.stock += 1;                       // 库存按同一规则释放，防止超卖
  audit(newStatus==="cancelled"?"取消兑换":"拒绝兑换", o.snap.nm, reason||"");
  save();
}

      return '<div class="opt-line '+cls+'"><span class="opt-k">'+["A","B","C","D"][i]+'</span><span>'+esc(o)+'</span></div>';
    }).join("");
    var stTag = m.state==="mastered" ? '<span class="tag green">已掌握</span>'
             : m.state==="archived"  ? '<span class="tag gray">已归档</span>'
             : m.state==="learning"  ? '<span class="tag yellow">复习中</span>'
             : '<span class="tag orange">待复习</span>';
    h += '<div class="mistake">' +
      '<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap">' +
        '<span class="tag" style="background:'+sj.bg+';color:'+sj.color+'">'+esc(sj.nm)+'</span>' +
        '<span class="tag gray">'+esc(kpName(m.kp))+'</span>' + stTag +
        '<span class="hint" style="margin-left:auto;font-size:.75rem">错 '+m.wrong+' 次</span>' +
      '</div>' +
      '<div class="mistake-q">'+esc(q.t)+'</div>' + opts +
      (m.next ? '<div class="hint" style="margin-top:7px;font-size:.78rem">下次复习：'+cnDate(m.next)+'</div>' : "") +
      (m.state!=="mastered" && m.state!=="archived"
        ? '<div class="btn-row" style="margin-top:9px"><button class="btn xs" data-act="mredo" data-mid="'+m.id+'">重做这题</button>'+
          '<button class="btn xs ghost" data-act="m-analysis" data-mid="'+m.id+'">看解析</button></div>'
        : "") +
      '<div class="reason-row">'+ REASONS.map(function(r){
          return '<button class="chip'+(m.reason===r?" on":"")+'" data-act="mreason" data-mid="'+m.id+'" data-r="'+r+'">'+r+'</button>';
        }).join("") + '</div>' +
    '</div>';
  });
  $("v-mistake").innerHTML = h;
  Array.prototype.forEach.call($("v-mistake").querySelectorAll("[data-mf]"), function(b){
    b.onclick = function(){ ui.mistakeFilter = b.getAttribute("data-mf"); renderMistake(); };
  });
  Array.prototype.forEach.call($("v-mistake").querySelectorAll("[data-act]"), function(b){
    var act = b.getAttribute("data-act"), mid = b.getAttribute("data-mid");
    b.onclick = function(){
      var m = state.mistakes.filter(function(x){ return x.id===mid; })[0];
      if(!m) return;
      if(act === "mredo"){
        var t = { id:"rv_"+m.id, type:"review", sj:m.sj, nm:"错题重做", est:2, done:false, qids:[m.q], fromMistake:m.id };
        if(!startQuiz(t, todayStr())) return;
        renderQuiz();
      } else if(act === "m-analysis"){
        var q = questionById(m.q);
        modal("解析", "<div style='font-size:.95rem;line-height:1.7'>"+esc(q.an)+"</div>", [{ t:"知道了", k:"ok" }]);
      } else if(act === "mreason"){
        m.reason = (m.reason === b.getAttribute("data-r")) ? "" : b.getAttribute("data-r");
        save(); renderMistake();
      }
    };
  });
}

/* ---------- 我的 / 成长中心 ---------- */
function expTotal(){
  var e = 0;
  state.attempts.forEach(function(a){ if(a.demo) return; e += (a.correct||0); });
  state.levels.forEach(function(L){ if(L.status==="done") e += 10; });
  return e;
}
function levelInfo(){
  var e = expTotal();
  var lv = Math.floor(Math.sqrt(e/12)) + 1;
  var cur = Math.pow(lv-1,2)*12, nxt = Math.pow(lv,2)*12;
  return { lv:lv, cur:e-cur, need:nxt-cur, pct: clamp(Math.round((e-cur)/Math.max(1,nxt-cur)*100),0,100) };
}

      '<div style="display:flex;gap:6px">' +
        [15,16,18,20].map(function(z){ return '<button class="chip'+(state.settings.fontSize===z?" on":"")+'" data-act="fs" data-z="'+z+'">'+z+'</button>'; }).join("") +
      '</div></div>' +

  h += '<div class="sec-title">'+ic("shield",19,"currentColor",2)+"<span>数据备份</span></div>";
  h += '<div class="card"><div class="hint" style="margin-bottom:10px">数据只保存在这台设备的浏览器里。换设备、清理浏览器数据都会丢失，请定期导出备份。</div>' +
    '<div class="btn-row">' +
      '<button class="btn sm ghost" data-act="export">'+ic("down",16,"#2F9E5F",2)+'导出备份</button>' +
      '<button class="btn sm gray" data-act="import">'+ic("up",16,"#5C7C68",2)+'导入恢复</button>' +

/* ---------- 答题渲染 ---------- */
function renderQuiz(){
  if(!quiz){ return; }
  var q = currentQ(); if(!q){ closeQuiz(); return; }
  var total = quiz.qids.length, i = quiz.idx;
  $("quizBar").style.width = Math.round((i)/total*100) + "%";
  $("quizIdx").textContent = (i+1) + "/" + total;
  var body = "";
  body += '<div class="q-meta">' +
    '<span class="tag" style="background:'+subjectById(q.sj).bg+';color:'+subjectById(q.sj).color+'">'+esc(subjectById(q.sj).nm)+'</span>' +
    '<span class="tag gray">'+esc(kpName(q.kp))+'</span>' +
    '<span class="tag gray">难度 '+"★".repeat(q.dif)+'</span>' +
  '</div>';
  body += '<div class="q-stem">'+esc(q.t)+'</div>';

  var dis = (quiz.phase !== "ask");
  q.o.forEach(function(o, idx){
    var cls = "";
    if(dis && quiz.resultOk && idx === quiz.lastPick) cls = " ok";
    if(dis && !quiz.resultOk && quiz.revealed && idx === q.a) cls = " ok";
    if(dis && !quiz.resultOk && quiz.gaveUp && idx === quiz.lastPick) cls = " no";
    if(dis) cls += " dis";
    body += '<button class="opt'+cls+'" data-pick="'+idx+'"'+(dis?" disabled":"")+'>' +
      '<span class="k">'+["A","B","C","D"][idx]+'</span><span class="tx">'+esc(o)+'</span></button>';
  });

  if(quiz.phase === "fb" && !quiz.resultOk && !quiz.gaveUp && quiz.hintText){
    body += '<div class="fb bad">' +
      '<div class="fb-hd">'+ic("bulb",19,"#B85C1E",2)+"<span>再想想，给你一点提示</span></div>" +
      '<div class="fb-tx">'+esc(quiz.hintText)+'</div>' +
      (quiz.showAnalysis ? '<div class="fb-tx" style="margin-top:8px;padding-top:8px;border-top:1px dashed rgba(232,131,58,.4)"><b>解析：</b>'+esc(q.an)+'</div>' : "") +
    '</div>';
  } else if(quiz.phase === "fb" && !quiz.resultOk && quiz.gaveUp){
    body += '<div class="fb bad">' +
      '<div class="fb-hd">'+ic("info",19,"#B85C1E",2)+"<span>没关系，记住它就好</span></div>" +
      '<div class="fb-tx"><b>正确答案：'+["A","B","C","D"][q.a]+'</b><br>'+esc(q.an)+'</div>' +
    '</div>';
  } else if(quiz.phase === "fb" && quiz.resultOk){
    body += '<div class="fb good">' +
      '<div class="fb-hd">'+ic("checkC",19,"#227A48",2)+"<span>答对了！</span></div>" +
      '<div class="fb-tx">'+esc(q.an)+'</div>' +
    '</div>';
  }
  $("quizBody").innerHTML = body;
  Array.prototype.forEach.call($("quizBody").querySelectorAll("[data-pick]"), function(b){
    b.onclick = function(){ submitAnswer(+b.getAttribute("data-pick")); };
  });

  var foot = "";
  if(quiz.phase === "fb"){
    if(!quiz.resultOk && !quiz.gaveUp && quiz.tries < 3){
      foot = '<button class="btn" data-act="again">'+ic("refresh",17,"#fff",2)+'再试一次</button>';
    } else {
      foot = '<button class="btn" data-act="next">'+(quiz.idx>=quiz.qids.length-1?"完成闯关":"下一题")+ic("arrowR",17,"#fff",2.2)+'</button>';
    }
  } else {
    foot = '<div class="hint" style="text-align:center;font-size:.8rem">选一个答案试试，答错会有提示</div>';
  }
  $("quizFoot").innerHTML = foot;
  Array.prototype.forEach.call($("quizFoot").querySelectorAll("[data-act]"), function(b){
    b.onclick = function(){ submitAnswer(null); };
  });
}

        var t = taskById(quiz ? quiz.task.id : att.planTaskId);
        if(t){ if(startQuiz(t, todayStr())) renderQuiz(); }
        else {
          var L = levelById(att.lv);
          if(L){ var ft = { id:"free_"+att.lv, type:"level", lv:att.lv, sj:L.sj, nm:subjectById(L.sj).nm+" · "+L.nm, est:5, done:false, free:true };

        }
      } else { refreshAll(); }
    };
  });
}

/* ---------- PIN：前端加盐哈希 + 失败冷却。仅防误触，不是强安全边界 ---------- */
function fallbackHash(s){
  var h1 = 0x811c9dc5, h2 = 0x01000193;
  for(var i=0;i<s.length;i++){
    h1 = (Math.imul(h1 ^ s.charCodeAt(i), 16777619) >>> 0);
    h2 = (Math.imul(h2 + s.charCodeAt(i), 2246822519) >>> 0);
  }
  return "f" + h1.toString(16) + h2.toString(16);
}
function hashPin(pin, salt){
  var s = salt + "|" + pin;
  if(window.crypto && crypto.subtle && crypto.subtle.digest && window.TextEncoder){
    try{
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
      });
    }catch(e){ /* 退回简单哈希 */ }
  }
  return Promise.resolve(fallbackHash(s));
}
function cooldownMs(){
  if(pinFail.n < 5) return 0;
  var extra = Math.min(pinFail.n - 5, 5);
  return (30 + extra*30) * 1000;

function renderPinPad(title){
  var wait = cooldownMs(), left = Math.ceil((wait - (Date.now() - pinFail.until))/1000);
  if(wait > 0 && left > 0){
    $("ptBody").innerHTML = '<div class="empty">'+ic("clock",40,"#B9D2C2",1.7)+

      '<button class="btn gray" data-pin="del" style="min-height:56px">'+ic("back",18,"#5C7C68",2.2)+'</button>' +
      '<button class="btn gray" data-pin="0" style="min-height:56px;font-size:1.25rem">0</button>' +
      '<button class="btn gray" data-pin="ok" style="min-height:56px">'+ic("check",20,"#2F9E5F",2.4)+'</button>' +
    '</div>' +
    '<div class="hint" style="margin-top:16px;font-size:.78rem">忘记密码只能导入备份或清空数据后重设。</div>' +
    '</div>';
  refreshPinDots();
  function verify(val){
    hashPin(val, state.parent.pinSalt).then(function(h){
      if(h === state.parent.pinHash){
        pinFail = { n:0, until:0 }; pinBuf = "";
        audit("进入家长中心","","PIN 验证通过");
        save(); enterParentUI();
      } else {
        pinFail.n++; pinFail.until = Date.now(); pinBuf = "";
        var cd = cooldownMs();
        toast(cd>0 ? "密码错误，已进入冷却" : "密码错误，还可试 "+(5-pinFail.n)+" 次","err");
        renderPinPad(cd>0 ? "请稍后再试" : "密码不对，再试试");
      }
    });
  }
  Array.prototype.forEach.call($("ptBody").querySelectorAll("[data-pin]"), function(b){
    b.onclick = function(){
      var v = b.getAttribute("data-pin");
      if(v==="del") pinBuf = pinBuf.slice(0,-1);
      else if(v==="ok"){ if(pinBuf.length===4) verify(pinBuf); return; }
      else if(pinBuf.length<4) pinBuf += v;
      refreshPinDots();
      if(pinBuf.length===4) setTimeout(function(){ verify(pinBuf); }, 140);
    };
  });
}

    warns.push("今天学习已 "+mins+" 分钟，超过预算 "+(state.settings.dailyBudgetMin)+" 分钟，注意休息。");

function renderSvgCharts(){
  var box = document.getElementById("ovChart");
  if(!box) return;
  var ds = [], vals = [];
  for(var i=6;i>=0;i--){
    var d = addDays(todayStr(), -i);
    var v = sum(state.attempts.filter(function(a){ return a.date===d && !a.demo; }), function(a){ return a.total; });
    ds.push(d); vals.push(v);
  }
  var maxV = Math.max(1, Math.max.apply(null, vals));
  var W = 320, H = 92, step = W/Math.max(1,vals.length-1);
  var pts = vals.map(function(v,i){ return (i*step) + "," + (H - 8 - (v/maxV)*(H-24)); });
  var poly = "0,"+(H-8)+" " + pts.join(" ") + " " + W + "," + (H-8);
  var html = '<svg viewBox="0 0 '+W+' '+(H+18)+'" width="100%" height="110" preserveAspectRatio="none" style="overflow:visible">';
  html += '<defs><linearGradient id="gfx" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#7BC47F" stop-opacity=".55"/><stop offset="100%" stop-color="#7BC47F" stop-opacity="0"/></linearGradient></defs>';
  html += '<polygon points="'+poly+'" fill="url(#gfx)"/>';
  html += '<polyline points="'+pts.join(" ")+'" fill="none" stroke="#2F9E5F" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  vals.forEach(function(v,i){
    html += '<circle cx="'+(i*step)+'" cy="'+(H - 8 - (v/maxV)*(H-24))+'" r="3.4" fill="#fff" stroke="#2F9E5F" stroke-width="2.4"/>';
    html += '<text x="'+(i*step)+'" y="'+(H+13)+'" text-anchor="middle" font-size="10" fill="#8AA595">'+(+ds[i].split("-")[2])+'</text>';
    if(v) html += '<text x="'+(i*step)+'" y="'+(H - 16 - (v/maxV)*(H-24))+'" text-anchor="middle" font-size="10" font-weight="700" fill="#227A48">'+v+'</text>';
  });

/* 知识点采用「同名复用」策略：输入同名时挂到同一个知识点上，保证掌握度可聚合 */
function ensureKp(sj, name){
  for(var i=0;i<SEED_KPS.length;i++) if(SEED_KPS[i][2]===name && SEED_KPS[i][1]===sj) return SEED_KPS[i][0];
  var id = "kp_" + uid("").replace(/^_/,"");
  SEED_KPS.push([id, sj, name]);
  return id;
}
function saveQuestion(qid, p){
  var kp = ensureKp(p.sj, p.kpNameRaw);
  if(qid){
    var q = questionById(qid);
    if(!q) return;
    q.t = p.t; q.o = p.o; q.a = p.a; q.an = p.an; q.hints = p.hints;
    q.dif = p.dif; q.est = p.est; q.kp = kp; q.sj = p.sj;
    q.version = (q.version||1) + 1;
    audit("修改题目", q.t.slice(0,20), "版本 v"+q.version);
  } else {
    var nid = "q_" + uid("").replace(/^_/,"");
    state.questions.push({ id:nid, sj:p.sj, kp:kp, dif:p.dif, est:p.est, t:p.t, o:p.o, a:p.a,
      hints:p.hints, an:p.an, status:"published", version:1, src:"parent" });
    /* 自动挂到该学科最后一关；没有关卡则由家长自行整理 */
    audit("新增题目", p.t.slice(0,20), "");
  }
  save(); renderParent(); refreshAll();
  toast("已保存","ok");
}

  var outSum = -sum(state.ledger.filter(function(L){ return L.amount<0; }), function(L){ return L.amount; });
  h += '<div class="hint">收入合计 '+inSum+' − 支出合计 '+outSum+' = 当前余额 <b>'+getBalance()+'</b>（账本自洽校验）</div>';
  return h;
}

/* ---------- 7. 报告 ---------- */
function ptReport(){
  var days = 7, d0 = addDays(todayStr(), -(days-1));
  var atts = state.attempts.filter(function(a){ return !a.demo && a.date >= d0; });
  var tq = sum(atts,function(a){ return a.total; }), tc = sum(atts,function(a){ return a.correct; });
  var mins = Math.round(sum(atts,function(a){ return (a.duration||0)/60; }));
  var activeDays = {}; atts.forEach(function(a){ activeDays[a.date]=1; });

  var h = '<div class="stat-grid">' +
    '<div class="stat"><div class="stat-n">'+Object.keys(activeDays).length+'</div><div class="stat-l">近 7 天活跃天</div></div>' +
    '<div class="stat"><div class="stat-n">'+tq+'</div><div class="stat-l">答题总数</div></div>' +
    '<div class="stat"><div class="stat-n">'+(tq?Math.round(tc/tq*100):0)+'%</div><div class="stat-l">总正确率</div></div>' +
    '<div class="stat"><div class="stat-n">'+mins+'</div><div class="stat-l">学习分钟</div></div>' +
  '</div>';

  /* 学科分布：真实作答聚合 */
  var bySj = {};
  atts.forEach(function(a){
    (a.responses||[]).forEach(function(r){
      var q = questionById(r.q); if(!q) return;
      if(!bySj[q.sj]) bySj[q.sj] = { n:0, ok:0 };
      bySj[q.sj].n++; if(r.ok) bySj[q.sj].ok++;
    });
  });
  h += '<div class="sec-title">'+ic("grid",18,"currentColor",2)+"<span>学科分布</span></div>";
  h += '<div class="card"><div class="scatter"><table class="rep"><tr><th>学科</th><th>题数</th><th>正确率</th></tr>' +
    state.subjects.map(function(sj){
      var v = bySj[sj.id] || { n:0, ok:0 };
      return '<tr><td>'+esc(sj.nm)+'</td><td class="n">'+v.n+'</td><td class="n">'+(v.n?Math.round(v.ok/v.n*100)+"%":"—")+'</td></tr>';
    }).join("") + '</table></div>' +
    '<div class="hint" style="margin-top:6px">共 '+tq+' 道题，全部来自真实作答记录，无任何写死的示例数字。</div></div>';

  /* 本周易错榜 */
  var wrongTop = {};
  atts.forEach(function(a){ (a.responses||[]).forEach(function(r){ if(!r.ok) wrongTop[r.q] = (wrongTop[r.q]||0)+1; }); });
  var sorted = Object.keys(wrongTop).sort(function(x,y){ return wrongTop[y]-wrongTop[x]; }).slice(0,8);
  h += '<div class="sec-title">'+ic("err",18,"currentColor",2)+"<span>本周易错榜</span></div>";
  if(!sorted.length) h += '<div class="card hint">近 7 天没有错题记录。</div>';
  sorted.forEach(function(qid){
    var q = questionById(qid); if(!q) return;
    h += '<div class="card tight" style="margin-bottom:7px"><div style="font-size:.88rem">'+esc(q.t)+'</div>' +
      '<div class="hint" style="font-size:.76rem;margin-top:2px">'+esc(kpName(q.kp))+' · 错 '+wrongTop[qid]+' 次</div></div>';
  });

  /* 知识点掌握明细：含各分量，方便家长判断可信度 */
  h += '<div class="sec-title">'+ic("target",18,"currentColor",2)+"<span>知识点掌握度明细</span>"+
       '<button class="btn xs gray" data-act="expRep" style="margin-left:auto">导出 CSV</button></div>';
  h += '<div class="card"><div class="scatter"><table class="rep">' +
    '<tr><th>知识点</th><th>掌握度</th><th>样本</th><th>近期正确率</th><th>建议</th></tr>';
  var rows = 0;
  kpList().forEach(function(kp){
    var m = computeMastery(kp);
    var adv;
    if(m.insufficient) adv = "样本不足，继续练习";
    else if(m.score >= 0.8) adv = "可进入下一步";
    else if(m.score >= 0.55) adv = "保持复习";
    else adv = "建议降难度重讲";
    h += '<tr><td>'+esc(kpName(kp))+'</td>' +
         '<td class="n">'+(m.insufficient?"—":Math.round(m.score*100)+"%")+'</td>' +
         '<td class="n">'+m.n+'</td>' +
         '<td class="n">'+(m.insufficient?"—":Math.round(m.parts.acc*100)+"%")+'</td>' +
         '<td>'+adv+'</td></tr>';
    rows++;
  });
  h += '</table></div><div class="hint" style="margin-top:6px">掌握度 = 0.45×近期正确率 + 0.20×跨日复现 + 0.15×难度表现 + 0.10×独立完成度 + 0.10×稳定性。样本少于 3 次不显示百分比。</div></div>';
  if(!rows) h = h.replace(/<table class="rep">[\s\S]*?<\/table>/, '<div class="hint">还没有知识点数据。</div>');
  return h;
}

/* ---------- CSV 导出 ---------- */
function downloadText(filename, text, mime){
  try{
    var blob = new Blob(["\ufeff"+text], { type: (mime||"text/csv")+";charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1200);
  }catch(e){ toast("导出失败："+e.message,"err"); }
}
function csvCell(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; }
function exportQsCsv(){
  var rows = [["题目ID","学科","知识点","难度","预计秒","题干","A","B","C","D","正确答案","解析"]];
  state.questions.forEach(function(q){
    rows.push([q.id, subjectById(q.sj).nm, kpName(q.kp), q.dif, q.est, q.t,
      q.o[0],q.o[1],q.o[2],q.o[3], ["A","B","C","D"][q.a], (q.an||"").replace(/<[^>]+>/g,"")]);
  });
  downloadText("题库导出_"+todayStr()+".csv", rows.map(function(r){ return r.map(csvCell).join(","); }).join("\n"));
  toast("题库已导出","ok");
}
function exportReportCsv(){
  var rows = [["知识点","学科","掌握度","样本数","近期正确率","跨日复现","难度表现","独立完成度","稳定性","建议"]];
  kpList().forEach(function(kp){
    var m = computeMastery(kp);
    var q = state.questions.filter(function(x){ return x.kp===kp; })[0];
    if(m.insufficient){ rows.push([kpName(kp), subjectById(q?q.sj:"").nm, "样本不足", m.n, "","","","","", "继续练习"]); return; }
    var adv = m.score>=0.8 ? "可进入下一步" : (m.score>=0.55 ? "保持复习" : "建议降难度重讲");
    rows.push([kpName(kp), subjectById(q?q.sj:"").nm, Math.round(m.score*100)+"%", m.n,
      Math.round(m.parts.acc*100)+"%", Math.round(m.parts.rep*100)+"%",
      Math.round(m.parts.dif*100)+"%", Math.round(m.parts.indep*100)+"%",
      Math.round(m.parts.stab*100)+"%", adv]);
  });
  downloadText("掌握度报告_"+todayStr()+".csv", rows.map(function(r){ return r.map(csvCell).join(","); }).join("\n"));
  toast("报告已导出","ok");
}

    if(quiz && !quiz.finished){
      modal("退出答题", "这次练习还没完成，退出后进度不会保存。确定退出吗？", [
        { t:"继续答题", k:"cancel" },
        { t:"退出", k:"danger", fn:function(){ closeQuiz(); refreshAll(); } }]);
    } else { closeQuiz(); refreshAll(); }
  };
  $("ptBack").innerHTML = ic("back",20,"#1B3D2A",2.2);
  $("ptBack").onclick = closeParent;
  $("ptLock").innerHTML = ic("lock",19,"#5C7C68",2);
  $("ptLock").onclick = function(){ toast("已退回孩子端","ok"); closeParent(); };
  $("modal").addEventListener("click", function(e){ if(e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

  /* PWA：仅在通过 http(s) 提供服务时注册，本地 file:// 打开不会出现 404 报错 */
  if((location.protocol === "http:" || location.protocol === "https:") && "serviceWorker" in navigator){
    try{ navigator.serviceWorker.register("./sw.js").catch(function(){}); }catch(e){}
  }

  /* 数据积累到 30 条作答时温和提醒备份 */
  var nAt = state.attempts.filter(function(a){ return !a.demo; }).length;
  if(nAt >= 30) setTimeout(function(){
    toast("已积累 "+nAt+" 次学习记录，建议在「我的」里导出一次备份","warn",4200);
  }, 1200);
}

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
</body>
</html>
